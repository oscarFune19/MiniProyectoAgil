name: Integracion Continua

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MiniProyectoAgil/MiniProyectoAgil.csproj

      - name: Verificar formato del codigo
        run: dotnet format MiniProyectoAgil/MiniProyectoAgil.csproj --verify-no-changes --no-restore

      - name: Compilar proyecto
        run: dotnet build MiniProyectoAgil/MiniProyectoAgil.csproj --configuration Release --no-restore
